services:

  app:
    build: .
    container_name: codigo42-app

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./web/public/assets/uploads:/var/www/html/uploads

    env_file:
      - ./backend/.env

    command: >
      sh -c "
        echo '====================================' &&
        echo ' Código 42 - Iniciando Backend' &&
        echo '====================================' &&
        echo '' &&
        echo '[COMPOSER] Verificando dependências...' &&
        (test -f /var/www/html/vendor/autoload.php || composer install --working-dir=/var/www/html --no-interaction --prefer-dist --no-progress) &&
        chown www-data:www-data /var/www/html/uploads &&
        echo '[SWAGGER] Verificando documentação...' &&
        php /var/www/html/docs/gerar-swagger.php &&
        echo '[BACKEND] Iniciando Apache...' &&
        apache2-foreground
      "

    restart: unless-stopped


  frontend:
    build:
      context: ./web

    container_name: codigo42-frontend

    ports:
      - "8081:8080"

    volumes:
      - ./web:/app

    restart: unless-stopped
