openapi: 3.0.3

info:
  title: Código 42 API
  description: API REST do sistema Código 42
  version: 1.0.0

servers:
  - url: http://localhost/codigo42/backend/src/public
    description: Servidor local

tags:
  - name: Autenticação
    description: Operações relacionadas à autenticação
  - name: Usuários
    description: Operações relacionadas aos usuários

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1

        nomeCompleto:
          type: string
          example: "Lucas Milhão"

        email:
          type: string
          format: email
          example: "lucas@gmail.com"

        telefone:
          type: string
          example: "51999999999"

        cpf:
          type: string
          example: "12345678900"

        ativo:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
          example: "lucas@gmail.com"

        senha:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."

paths:

  /login:

    post:
      tags:
        - Autenticação

      summary: Realiza login

      description: |
        Autentica um usuário através de email e senha
        e retorna um token JWT.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:

        '200':
          description: Login realizado com sucesso

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Email ou senha inválidos

  /auth/me:

    get:
      tags:
        - Autenticação

      summary: Obtém o usuário autenticado

      description: |
        Valida o JWT enviado na requisição e retorna
        as informações do usuário autenticado.

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Usuário autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

        '401':
          description: Token não informado, inválido ou expirado

  /usuarios:

    get:
      tags:
        - Usuários

      summary: Lista os usuários

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Lista de usuários

          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'

        '401':
          description: Usuário não autenticado

    post:
      tags:
        - Usuários

      summary: Cria um usuário

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              required:
                - nomeCompleto
                - email
                - telefone
                - cpf
                - senha

              properties:

                nomeCompleto:
                  type: string
                  example: "Lucas Milhão"

                email:
                  type: string
                  format: email
                  example: "lucas@gmail.com"

                telefone:
                  type: string
                  example: "51999999999"

                cpf:
                  type: string
                  example: "12345678900"

                senha:
                  type: string
                  format: password
                  example: "123456"

      responses:

        '201':
          description: Usuário criado com sucesso

        '400':
          description: Dados inválidos

  /usuarios/{id}:

    get:
      tags:
        - Usuários

      summary: Busca um usuário pelo ID

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      responses:

        '200':
          description: Usuário encontrado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

        '401':
          description: Usuário não autenticado

        '404':
          description: Usuário não encontrado

    delete:
      tags:
        - Usuários

      summary: Remove um usuário

      description: |
        Remove um usuário do sistema.
        Apenas usuários ADMIN devem possuir permissão
        para executar esta operação.

      security:
        - bearerAuth: []

      parameters:

        - name: id
          in: path
          required: true

          description: ID do usuário que será removido

          schema:
            type: integer

          example: 15

      responses:

        '200':
          description: Usuário removido com sucesso

          content:
            application/json:
              example:
                mensagem: "Usuário removido com sucesso."

        '401':
          description: Usuário não autenticado

        '403':
          description: Usuário autenticado, mas sem permissão

        '404':
          description: Usuário não encontrado